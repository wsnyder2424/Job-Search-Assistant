<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Settings — one page becomes two</title>
<style>
  :root{
    --slide-bg:#FDFDFC;
    --card:#FFFFFF;
    --card-border:#E4E8EE;
    --bar-header:#AEB7C4;
    --bar-label:#CCD3DD;
    --bar-sub:#E0E5EC;
    --track:#E0E5EB;
    --track-on:#BCC4CF;
    --value:#D5DBE4;
    --chrome-bg:#F7F9FB;
    --chrome-line:#DDE2E9;
    --fill:#C4CCD6;
    --ink:#39414E;
    --title:#333B47;
  }

  html,body{height:100%;}
  body{
    margin:0;
    overflow:hidden;
    background:var(--slide-bg);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  }

  /* 16:9 logical stage, scaled to fit whatever it is projected on */
  #stage{ position:absolute; width:1600px; height:900px; transform-origin:top left; }

  /* Two layers per page: the outer one carries position and scale, the inner
     one carries the tilt and the shadow. Keeping them apart means the card can
     rotate about its own centre while the page is placed from its top left. */
  .page{
    position:absolute; left:0; top:0;
    width:640px;
    transform-origin:0 0;
  }
  .card{
    width:100%;
    box-sizing:border-box;
    background:var(--card);
    border:1px solid var(--card-border);
    border-radius:20px;
    box-shadow:0 1px 2px rgba(16,24,40,.04), 0 18px 44px -14px rgba(16,24,40,.16);
    transform-origin:50% 50%;
    padding:34px;
    display:flex; flex-direction:column;
  }

  /* the page's name, in the same treatment as slide 3 */
  .title{
    font-size:19px;
    font-weight:600;
    letter-spacing:-.01em;
    color:var(--title);
    margin-bottom:24px;
  }

  /* ---- structure ---- */
  .section + .section{ margin-top:30px; }
  .row{
    position:relative;
    display:flex; align-items:center; gap:20px;
    min-height:36px;
  }
  .row + .row{ margin-top:16px; }
  .labels, .ctrls{ position:relative; z-index:1; }
  .labels{ flex:1 1 auto; min-width:0; }
  .ctrls{ flex:0 0 auto; display:flex; align-items:center; }

  /* the soft wash that marks a row as it changes */
  .glow{
    position:absolute; inset:-8px -14px;
    border-radius:10px;
    background:rgba(57,65,78,.075);
    opacity:0; z-index:0;
  }

  /* ---- skeleton bars ---- */
  .bar{
    border-radius:7px;
    background-color:var(--bar-label);
    background-image:linear-gradient(100deg,
      rgba(255,255,255,0) 38%, rgba(255,255,255,.3) 50%, rgba(255,255,255,0) 62%);
    background-size:260% 100%;
    background-repeat:no-repeat;
    animation:shimmer 3.6s linear infinite;
  }
  .bar.head{ height:12px; border-radius:6px; background-color:var(--bar-header); margin-bottom:22px; }
  .bar.label{ height:14px; }
  .bar.sub{ height:10px; border-radius:5px; margin-top:8px; background-color:var(--bar-sub); }

  @keyframes shimmer{
    0%   { background-position:150% 0; }
    100% { background-position:-150% 0; }
  }

  /* ---- controls ---- */
  .toggle{ width:46px; height:26px; border-radius:13px; background:var(--track); position:relative; }
  .toggle.on{ background:var(--track-on); }
  .knob{
    position:absolute; top:3px; left:3px; width:20px; height:20px;
    border-radius:50%; background:#fff; box-shadow:0 1px 2px rgba(16,24,40,.22);
  }
  .toggle.on .knob{ left:23px; }

  .value{ width:78px; height:12px; border-radius:6px; background:var(--value); }

  .select{
    width:132px; height:30px; box-sizing:border-box;
    border:1px solid var(--chrome-line); border-radius:8px;
    background:var(--chrome-bg);
    display:flex; align-items:center; justify-content:space-between;
    padding:0 10px;
  }
  .select .pill{ height:10px; border-radius:5px; background:var(--value); width:58px; }
  .caret{
    width:7px; height:7px; flex:0 0 auto;
    border-right:2px solid var(--bar-header);
    border-bottom:2px solid var(--bar-header);
    transform:translateY(-2px) rotate(45deg);
  }

  .slider{ width:132px; height:16px; position:relative; display:flex; align-items:center; }
  .slider .rail{ position:absolute; left:0; right:0; height:4px; border-radius:2px; background:var(--track); }
  .slider .fill{ position:absolute; left:0; height:4px; border-radius:2px; background:var(--fill); width:34%; }
  .slider .grip{
    position:absolute; left:calc(34% - 8px);
    width:16px; height:16px; border-radius:50%;
    background:#fff; border:1px solid var(--chrome-line);
    box-shadow:0 1px 2px rgba(16,24,40,.2);
  }

  /* ---- the pointer and its click ring ---- */
  #cursor{
    position:absolute; left:0; top:0;
    width:26px; height:36px;
    z-index:40; opacity:0;
    filter:drop-shadow(0 2px 4px rgba(16,24,40,.28));
  }
  .ring{
    position:absolute; left:0; top:0;
    width:26px; height:26px; margin:-13px 0 0 -13px;
    border-radius:50%;
    border:2px solid rgba(57,65,78,.5);
    opacity:0; z-index:35;
  }
</style>
</head>
<body>
<div id="stage">
  <div class="page" id="pageCopy" style="z-index:1"><div class="card"></div></div>
  <div class="page" id="pageOrig" style="z-index:2"><div class="card"></div></div>

  <div class="ring" id="ring"></div>
  <svg id="cursor" viewBox="0 0 17 23" aria-hidden="true">
    <path d="M1 1 L1 20 L6 15.6 L9 22 L12.4 20.5 L9.5 14.3 L15.6 14 Z"
          fill="#FFFFFF" stroke="#39414E" stroke-width="1.6" stroke-linejoin="round"/>
  </svg>
</div>

<script>
(function(){
  "use strict";

  const STAGE_W = 1600, STAGE_H = 900;

  // Intrinsic page width. Every on-screen size is this box under a scale, so
  // the content shrinks with the card rather than being re-laid out. The
  // height is measured off the built page, so editing the rows needs no
  // numbers changed here.
  const CARD_W = 640;
  let CARD_H = 0;

  /* ---------------- content ------------------------------------------ *
   * Built once, then cloned. Cloning is what guarantees the two pages are
   * genuinely identical — same rows, same states, same shimmer offsets —
   * rather than two independent renders that merely look alike.
   * ------------------------------------------------------------------ */

  const SECTIONS = [
    { rows:[
      { w:.46, sub:.30, ctrl:'toggle-on' },
      { w:.60,          ctrl:'toggle', mark:'a' },
      { w:.40, sub:.26, ctrl:'value'     },
    ]},
    { head:.28, rows:[
      { w:.52,          ctrl:'select', mark:'b' },
      { w:.44, sub:.28, ctrl:'toggle-on' },
      { w:.58,          ctrl:'slider', mark:'c' },
    ]},
    { head:.22, rows:[
      { w:.48, sub:.30, ctrl:'toggle'    },
      { w:.38,          ctrl:'value'     },
      { w:.54,          ctrl:'select'    },
    ]},
  ];

  const el = (cls, html) => {
    const d = document.createElement('div');
    if (cls) d.className = cls;
    if (html) d.innerHTML = html;
    return d;
  };

  const CONTROLS = {
    'toggle':    () => el('toggle', '<div class="knob"></div>'),
    'toggle-on': () => el('toggle on', '<div class="knob"></div>'),
    'value':     () => el('value'),
    'select':    () => el('select', '<div class="pill"></div><div class="caret"></div>'),
    'slider':    () => el('slider',
                    '<div class="rail"></div><div class="fill"></div><div class="grip"></div>'),
  };

  function buildPage(into, title){
    const heading = el('title');
    heading.textContent = title;
    into.appendChild(heading);

    SECTIONS.forEach(sec => {
      const section = el('section');
      if (sec.head){
        const head = el('bar head');
        head.style.width = (sec.head * 100) + '%';
        section.appendChild(head);
      }

      sec.rows.forEach(r => {
        const row = el('row');
        if (r.mark) row.dataset.mark = r.mark;
        row.appendChild(el('glow'));

        const labels = el('labels');
        const label = el('bar label');
        label.style.width = (r.w * 100) + '%';
        labels.appendChild(label);
        if (r.sub){
          const sub = el('bar sub');
          sub.style.width = (r.sub * 100) + '%';
          labels.appendChild(sub);
        }
        row.appendChild(labels);

        const ctrls = el('ctrls');
        ctrls.appendChild(CONTROLS[r.ctrl]());
        row.appendChild(ctrls);

        section.appendChild(row);
      });
      into.appendChild(section);
    });

    // de-sync the shimmer between rows — but the clone inherits these exact
    // offsets, so the two pages stay in step with each other
    into.querySelectorAll('.bar').forEach(b => {
      b.style.animationDelay = (-Math.random() * 3.6).toFixed(2) + 's';
    });
  }

  const pageOrig = document.getElementById('pageOrig');
  const pageCopy = document.getElementById('pageCopy');
  const cardOrig = pageOrig.firstElementChild;
  const cardCopy = pageCopy.firstElementChild;

  buildPage(cardOrig, 'Default view');
  cardCopy.replaceWith(cardOrig.cloneNode(true));
  const cardCopy2 = pageCopy.firstElementChild;
  const cursor    = document.getElementById('cursor');
  const ring      = document.getElementById('ring');

  cardCopy2.querySelector('.title').textContent = 'Recruiter view';

  CARD_H = cardOrig.offsetHeight;

  /* ---------------- placement ---------------------------------------- */

  // Place a page by the width it should appear at and where its centre sits.
  function frame(width, cx, cy){
    const s = width / CARD_W;
    const x = cx - width / 2;
    const y = cy - (CARD_H * s) / 2;
    return `translate(${x.toFixed(2)}px, ${y.toFixed(2)}px) scale(${s.toFixed(4)})`;
  }

  const MID_Y = 450;
  const A     = frame(720, 800, MID_Y);          // the single page
  const LIFT  = frame(744, 800, MID_Y - 4);      // picked up off the ground
  const PEEK  = frame(720, 818, MID_Y + 15);     // the copy, edge showing behind
  const B1    = frame(640, 450, MID_Y);          // settled left
  const B2    = frame(640, 1150, MID_Y);         // settled right
  const MID_C = frame(672, 990, MID_Y - 26);     // the copy, mid flight
  const MID_O = frame(684, 620, MID_Y + 10);     // the original, mid flight

  // Where each page ends up, in stage coordinates.
  const PAGE_Y  = MID_Y - CARD_H / 2;
  const LEFT_X  = 450 - CARD_W / 2;
  const RIGHT_X = 1150 - CARD_W / 2;

  /* A control's place on the stage, worked out from layout offsets rather
     than a measured rectangle: the pages are mid-flight and under a scale
     when the timeline is built, but offsetLeft/offsetTop are layout values
     and ignore transforms, so these land correctly whatever is moving. */
  function offsetIn(node, ancestor){
    let x = 0, y = 0, n = node;
    while (n && n !== ancestor){ x += n.offsetLeft; y += n.offsetTop; n = n.offsetParent; }
    return { x, y };
  }
  function seat(node, page, pageX){
    const off = offsetIn(node, page);
    return { x:pageX + off.x + node.offsetWidth / 2,
             y:PAGE_Y + off.y + node.offsetHeight / 2 };
  }

  const rowOf  = (card, mark) => card.querySelector(`.row[data-mark="${mark}"]`);
  const ctrlOf = (card, mark) => rowOf(card, mark).querySelector('.ctrls > *');

  const PAGES = [
    { page:pageOrig, card:cardOrig,  x:LEFT_X  },
    { page:pageCopy, card:cardCopy2, x:RIGHT_X },
  ];

  /* ---------------- the three edits ----------------------------------- *
   * Each knows how to play itself on a control, so the identical routine
   * runs on the left page and then, a beat later, all over again on the
   * right one. That repetition is the point of the slide.
   * ------------------------------------------------------------------ */

  const EDITS = {
    a: (node, delay) => {                       // a switch comes on
      animate(node, [{ background:'#E0E5EB' }, { background:'#BCC4CF' }],
        { duration:300, delay, easing:'ease-out' });
      animate(node.querySelector('.knob'), [{ left:'3px' }, { left:'23px' }],
        { duration:300, delay, easing:'cubic-bezier(.4,1.4,.5,1)' });
    },
    b: (node, delay) => {                       // a different option is chosen
      animate(node.querySelector('.pill'), [
        { width:'58px', opacity:1 },
        { width:'58px', opacity:.15, offset:.35 },
        { width:'92px', opacity:.15, offset:.45 },
        { width:'92px', opacity:1 }
      ], { duration:480, delay, easing:'ease-in-out' });
    },
    c: (node, delay) => {                       // a slider is pushed up
      animate(node.querySelector('.fill'), [{ width:'34%' }, { width:'72%' }],
        { duration:480, delay, easing:'cubic-bezier(.3,.9,.35,1)' });
      animate(node.querySelector('.grip'),
        [{ left:'calc(34% - 8px)' }, { left:'calc(72% - 8px)' }],
        { duration:480, delay, easing:'cubic-bezier(.3,.9,.35,1)' });
    },
  };

  const REST_SHADOW = '0 1px 2px rgba(16,24,40,.04), 0 18px 44px -14px rgba(16,24,40,.16)';
  const LIFT_SHADOW = '0 2px 4px rgba(16,24,40,.06), 0 38px 84px -20px rgba(16,24,40,.30)';

  /* ---------------- timeline ------------------------------------------ *
   * beat 1  the page is picked up, and a second edge shows behind it
   * beat 2  the copy slides out to the right, the original settles left
   * beat 3  both come to rest, identical
   * -------------------------------------------------------------------- */

  const HOLD      = 5000;  // sit on the single page this long before moving
  const LIFT_DUR  = 420;
  const COPY_AT   = HOLD + LIFT_DUR + 40;
  const COPY_DUR  = 760;
  const ORIG_AT   = COPY_AT + 100;
  const ORIG_DUR  = 700;

  // the cursor's pass over each page
  const EDIT_START   = 6500;   // once the two pages have settled
  const TRAVEL       = 640;    // pointer between controls
  const SETTLE       = 200;    // beat between arriving and clicking
  const STEP         = 760;    // from one click to the next move
  const SWITCH_PAUSE = 1500;   // the wait before starting the second page
  const GLOW_IN      = 180;
  const GLOW_HOLD    = 700;

  const EASE_LIFT = 'cubic-bezier(.3,.9,.4,1)';
  const EASE_DEAL = 'cubic-bezier(.5,.02,.25,1)';
  const EASE_MOVE = 'cubic-bezier(.45,.05,.2,1)';

  // Everything after the hold is stretched by this. Raise it to slow the
  // whole sequence, lower it to tighten — the hold stays 5s either way.
  const RATE = 1;

  const anims = [];
  const REDUCED = window.matchMedia('(prefers-reduced-motion: reduce)');

  function animate(node, frames, opts){
    const o = Object.assign({ fill:'forwards' }, opts);
    o.duration = (o.duration || 0) * RATE;
    o.delay    = HOLD + ((o.delay || 0) - HOLD) * RATE;   // hold stays put
    const a = node.animate(frames, o);
    anims.push(a);
    return a;
  }

  function reset(){
    anims.forEach(a => a.cancel());
    anims.length = 0;
    pageOrig.style.transform = A;
    pageCopy.style.transform = A;
    cardOrig.style.transform = 'rotate(0deg)';
    cardCopy2.style.transform = 'rotate(0deg)';
    cardOrig.style.boxShadow = REST_SHADOW;
    cardCopy2.style.boxShadow = REST_SHADOW;
    cursor.style.opacity = 0;
    ring.style.opacity = 0;

    PAGES.forEach(({ card }) => {
      card.querySelectorAll('.glow').forEach(g => { g.style.opacity = 0; });
      const t = ctrlOf(card, 'a');
      t.style.background = '#E0E5EB';
      t.querySelector('.knob').style.left = '3px';
      ctrlOf(card, 'b').querySelector('.pill').style.cssText = 'width:58px;opacity:1';
      const sl = ctrlOf(card, 'c');
      sl.querySelector('.fill').style.width = '34%';
      sl.querySelector('.grip').style.left  = 'calc(34% - 8px)';
    });
  }

  function snapToEnd(){
    pageOrig.style.transform = B1;
    pageCopy.style.transform = B2;
    PAGES.forEach(({ card }) => {
      const t = ctrlOf(card, 'a');
      t.style.background = '#BCC4CF';
      t.querySelector('.knob').style.left = '23px';
      ctrlOf(card, 'b').querySelector('.pill').style.width = '92px';
      const sl = ctrlOf(card, 'c');
      sl.querySelector('.fill').style.width = '72%';
      sl.querySelector('.grip').style.left  = 'calc(72% - 8px)';
    });
  }

  function play(){
    reset();
    if (REDUCED.matches){ snapToEnd(); return; }

    /* beat 1 — lift, and let the copy's edge show behind */
    animate(pageOrig, [{ transform:A }, { transform:LIFT }],
      { duration:LIFT_DUR, delay:HOLD, easing:EASE_LIFT });
    animate(cardOrig, [{ boxShadow:REST_SHADOW }, { boxShadow:LIFT_SHADOW }],
      { duration:LIFT_DUR, delay:HOLD, easing:EASE_LIFT });
    animate(pageCopy, [{ transform:A }, { transform:PEEK }],
      { duration:LIFT_DUR, delay:HOLD + 60, easing:EASE_LIFT });

    /* beat 2 — the copy is dealt out to the right */
    animate(pageCopy, [
      { transform:PEEK },
      { transform:MID_C, offset:.5 },
      { transform:B2 }
    ], { duration:COPY_DUR, delay:COPY_AT, easing:EASE_DEAL });

    animate(cardCopy2, [
      { transform:'rotate(0deg)' },
      { transform:'rotate(2.6deg)', offset:.45 },
      { transform:'rotate(0deg)' }
    ], { duration:COPY_DUR, delay:COPY_AT, easing:EASE_DEAL });

    animate(cardCopy2, [
      { boxShadow:REST_SHADOW },
      { boxShadow:LIFT_SHADOW, offset:.45 },
      { boxShadow:REST_SHADOW }
    ], { duration:COPY_DUR, delay:COPY_AT, easing:EASE_DEAL });

    /* beat 2 — and the original settles into the left slot */
    animate(pageOrig, [
      { transform:LIFT },
      { transform:MID_O, offset:.5 },
      { transform:B1 }
    ], { duration:ORIG_DUR, delay:ORIG_AT, easing:EASE_DEAL });

    animate(cardOrig, [
      { transform:'rotate(0deg)' },
      { transform:'rotate(-1.6deg)', offset:.45 },
      { transform:'rotate(0deg)' }
    ], { duration:ORIG_DUR, delay:ORIG_AT, easing:EASE_DEAL });

    animate(cardOrig, [{ boxShadow:LIFT_SHADOW }, { boxShadow:REST_SHADOW }],
      { duration:ORIG_DUR, delay:ORIG_AT, easing:EASE_DEAL });

    /* beat 4 — the same three settings are configured by hand, first on one
       page and then, after a pause, all over again on the other */

    const put = p => `translate(${p.x.toFixed(1)}px, ${p.y.toFixed(1)}px)`;
    const START = { x:LEFT_X + 120, y:PAGE_Y + CARD_H + 100 };
    const EXIT  = { x:RIGHT_X + 320, y:PAGE_Y + CARD_H + 130 };

    cursor.style.transform = put(START);
    animate(cursor, [{ opacity:0 }, { opacity:1 }],
      { duration:280, delay:EDIT_START - 280, easing:'ease-out' });

    let at = START, t = EDIT_START;

    PAGES.forEach(({ page, card, x }, pageIndex) => {
      if (pageIndex) t += SWITCH_PAUSE;          // the deliberate wait between pages

      ['a','b','c'].forEach(mark => {
        const node = ctrlOf(card, mark);
        const to   = seat(node, page, x);

        animate(cursor, [{ transform:put(at) }, { transform:put(to) }],
          { duration:TRAVEL, delay:t, easing:EASE_MOVE });

        const click = t + TRAVEL + SETTLE;

        animate(cursor, [{ scale:1 }, { scale:.88, offset:.35 }, { scale:1 }],
          { duration:280, delay:click, easing:'ease-out' });

        animate(ring, [
          { transform:put(to) + ' scale(.35)', opacity:.55 },
          { transform:put(to) + ' scale(2.6)', opacity:0 }
        ], { duration:560, delay:click, easing:'cubic-bezier(.2,.7,.3,1)' });

        animate(rowOf(card, mark).querySelector('.glow'), [
          { opacity:0 }, { opacity:1, offset:.18 },
          { opacity:1, offset:.75 }, { opacity:0 }
        ], { duration:GLOW_IN + GLOW_HOLD, delay:click, easing:'ease-in-out' });

        EDITS[mark](node, click + 90);

        at = to;
        t  = click + STEP;
      });
    });

    animate(cursor, [{ transform:put(at) }, { transform:put(EXIT) }],
      { duration:760, delay:t + 240, easing:'cubic-bezier(.4,0,.7,1)' });
    animate(cursor, [{ opacity:1 }, { opacity:0 }],
      { duration:440, delay:t + 460, easing:'ease-in' });
  }

  /* ---------------- fit to screen + presenter controls ---------------- */

  const stage = document.getElementById('stage');
  function fit(){
    const s = Math.min(window.innerWidth / STAGE_W, window.innerHeight / STAGE_H);
    stage.style.transform = `scale(${s})`;
    stage.style.left = ((window.innerWidth  - STAGE_W * s) / 2) + 'px';
    stage.style.top  = ((window.innerHeight - STAGE_H * s) / 2) + 'px';
  }
  window.addEventListener('resize', fit);
  fit();

  // Click anywhere, or press space / R, to replay.
  window.addEventListener('click', play);
  window.addEventListener('keydown', e => {
    if (e.key === ' ' || e.key.toLowerCase() === 'r'){ e.preventDefault(); play(); }
  });

  play();
})();
</script>
</body>
</html>
